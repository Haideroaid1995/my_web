<!DOCTYPE html>
<html dir="rtl">
<head>
  <title>قائمة التسوق (دون اتصال)</title>
  <style>
    body { font-family: Arial; text-align: center; padding: 20px; }
    #offline-items { text-align: right; margin: 20px; }
  </style>
</head>
<body>
  <h1>أنت متصل حالياً دون إنترنت</h1>
  <p>التغييرات سيتم مزامنتها عند عودة الاتصال</p>
  <div id="offline-items"></div>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const items = JSON.parse(localStorage.getItem('shoppingList')) || [];
      const container = document.getElementById('offline-items');
      
      items.forEach(item => {
        const div = document.createElement('div');
        div.textContent = `${item[0]} - ${item[1]}`;
        container.appendChild(div);
      });
    });
  </script>
</body>
</html>
